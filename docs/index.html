<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6e69">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cap Brevet">
<link rel="stylesheet" href="fonts/polices.css">
<script>
/* Version installable : mise en mémoire hors connexion et demande de stockage durable. */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</head>
<title>Cap Brevet Maths</title>
<meta name="description" content="Application de révision des mathématiques pour le brevet des collèges.">
<style>
/* Mise en page : mobile d'abord, barre d'onglets en bas ; dès 900 px, barre à gauche et énoncé à côté de la réponse.
   Deux univers : Entraînement (sarcelle + soleil, vivant) et Examen blanc (gris neutre, aucune animation). */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --surface2:#e7eeee; --ink:#13252a; --muted:#52676d; --line:#d2dcdd;
  --accent:#0b6e69; --accent-ink:#ffffff; --accent-soft:#d5eeec;
  --sun:#f0b429; --sun-ink:#3b2900; --sun-soft:#fdf1d2;
  --ok:#1b7742; --ok-bg:#e0f2e7; --part:#a95600; --part-bg:#fcecd8; --ko:#bd2f28; --ko-bg:#fae2df;
  --lv0:#9aa9ad; --lv1:#6d8088; --lv2:#2a76ad; --lv3:#0b6e69; --lv4:#a86a00;
  --exam-bg:#eceef0; --exam-surface:#ffffff; --exam-line:#c8cdd2; --band:#2a3036; --band-ink:#ffffff;
  --font-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-b:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --scale:1; --nav-w:236px; --radius:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1719; --surface:#162225; --surface2:#1e2d31; --ink:#e4eef0; --muted:#9bb0b5; --line:#2b3c40;
  --accent:#3dbab1; --accent-ink:#04201e; --accent-soft:#143b38;
  --sun:#f5c451; --sun-ink:#2b1e00; --sun-soft:#3a2f12;
  --ok:#5fcb8c; --ok-bg:#12321f; --part:#f1a24e; --part-bg:#3a250e; --ko:#f2786f; --ko-bg:#3c1613;
  --lv0:#56666a; --lv1:#7f939a; --lv2:#5aa6dc; --lv3:#3dbab1; --lv4:#e0a63a;
  --exam-bg:#14171a; --exam-surface:#1c2024; --exam-line:#343a40; --band:#d3d9de; --band-ink:#111518;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1719; --surface:#162225; --surface2:#1e2d31; --ink:#e4eef0; --muted:#9bb0b5; --line:#2b3c40;
  --accent:#3dbab1; --accent-ink:#04201e; --accent-soft:#143b38;
  --sun:#f5c451; --sun-ink:#2b1e00; --sun-soft:#3a2f12;
  --ok:#5fcb8c; --ok-bg:#12321f; --part:#f1a24e; --part-bg:#3a250e; --ko:#f2786f; --ko-bg:#3c1613;
  --lv0:#56666a; --lv1:#7f939a; --lv2:#5aa6dc; --lv3:#3dbab1; --lv4:#e0a63a;
  --exam-bg:#14171a; --exam-surface:#1c2024; --exam-line:#343a40; --band:#d3d9de; --band-ink:#111518;
  color-scheme:dark }

html{font-size:calc(16px * var(--scale))}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:1rem;line-height:1.5}
body.exam{--bg:var(--exam-bg);--surface:var(--exam-surface);--line:var(--exam-line);--accent:var(--band);--accent-ink:var(--band-ink);--accent-soft:var(--surface2)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* ---------- Structure ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .in{display:flex;align-items:center;gap:10px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1120px;margin:0 auto}
.brand{font-family:var(--font-d);font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px;margin-right:auto;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden}
.iconbtn{flex:none}
@media (max-width:480px){.topbar .saved{font-size:.72rem;white-space:nowrap}.brand .tag{display:none}}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.85rem}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--muted)}
.iconbtn{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0 10px;font-weight:700}
.iconbtn:hover{background:var(--surface2)}
main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px;display:flex;flex-direction:column;gap:18px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:.75rem;font-weight:700;min-height:52px;justify-content:center;text-align:center}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
body.exam nav.tabs, body.exam .topbar{display:none}
body.exam main{padding-bottom:24px}

@media (min-width:900px){
  nav.tabs{top:0;bottom:0;right:auto;width:var(--nav-w);display:flex;flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line);padding:calc(76px + env(safe-area-inset-top,0px)) 12px 16px max(12px,env(safe-area-inset-left,0px))}
  nav.tabs a{flex-direction:row;justify-content:flex-start;gap:12px;font-size:.95rem;padding:10px 14px;min-height:48px}
  .topbar{z-index:26}
  body:not(.exam) main{margin-left:var(--nav-w);padding-bottom:32px}
  body:not(.exam) .topbar .in{max-width:none}
}

/* ---------- Composants ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.grid2{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:.8rem;font-weight:700;background:var(--surface2);color:var(--ink);white-space:nowrap}
.lv{--c:var(--lv1);display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--c);white-space:nowrap}
.lv i{display:inline-flex;gap:2px}
.lv i b{width:7px;height:12px;border-radius:2px;background:var(--c);opacity:.25}
.lv i b.on{opacity:1}
.lv[data-l="0"]{--c:var(--lv0)} .lv[data-l="1"]{--c:var(--lv1)} .lv[data-l="2"]{--c:var(--lv2)} .lv[data-l="3"]{--c:var(--lv3)} .lv[data-l="4"]{--c:var(--lv4)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.saved{font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.saved::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.notice{border-radius:12px;padding:10px 14px;background:var(--sun-soft);border:1px solid var(--sun);font-size:.9rem}

/* Accueil */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .eyebrow{color:inherit;opacity:.85}
.hero h1{font-size:2rem}
.hero .big{font-family:var(--font-d);font-weight:800;font-size:3.2rem;line-height:1}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap}
.hero .stat{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;font-size:.85rem}
.hero .stat b{display:block;font-size:1.15rem;font-family:var(--font-d)}
.daily{border:2px solid var(--sun);background:var(--sun-soft)}
.daily .btn.sun{font-size:1.05rem;min-height:56px}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:56px;color:var(--ink);text-decoration:none}
.rowbtn:hover{background:var(--surface2)}
.rowbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rowbtn .t{flex:1;min-width:0}
.rowbtn .t b{display:block}

/* Entraînement */
.train{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:1100px){.train{grid-template-columns:1.1fr .9fr;align-items:start}.train .detail{position:sticky;top:76px}}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step{border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;font-size:.8rem;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.step .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--font-d);background:var(--surface2);color:var(--muted)}
.step.done .ico{background:var(--accent);color:var(--accent-ink)}
.step.cur{border-color:var(--accent);background:var(--accent-soft)}
.step.cur .ico{background:var(--sun);color:var(--sun-ink)}
.step b{font-size:.82rem;overflow-wrap:anywhere}
.flash{background:var(--surface2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}

/* Maths */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.1}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
.frac>span{padding:0 .2em}
.enonce{font-size:1.2rem;line-height:1.7}
.enonce .math{font-size:1.45rem;font-weight:700;white-space:nowrap}

/* Exercice */
.ex-grid{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:900px){.ex-grid{grid-template-columns:1fr 1fr;align-items:start}}
.ansrow{display:flex;gap:8px;align-items:stretch}
.mathin{flex:1;min-width:0;font-size:1.35rem;font-weight:700;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);min-height:56px;font-variant-numeric:tabular-nums}
.mathin:focus{border-color:var(--accent);outline:none}
.suffix{display:grid;place-items:center;padding:0 12px;border-radius:12px;background:var(--surface2);font-weight:700}
select{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:6px 10px;max-width:100%}
.kbd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;user-select:none;-webkit-user-select:none}
.kbd button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:1.05rem;cursor:pointer;padding:0;touch-action:manipulation}
.kbd button:active{background:var(--line)}
.kbd button.op{background:var(--accent-soft);color:var(--ink)}
.kbd button.wide{grid-column:span 2}
.hints{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.hints li{background:var(--sun-soft);border-left:4px solid var(--sun);border-radius:8px;padding:8px 12px}
details.draft summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
textarea{width:100%;min-height:120px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:10px;resize:vertical}

.fb{border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start;border:2px solid}
.fb .mk{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.1rem;color:#fff}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.ok .mk{background:var(--ok)}
.fb.part,.fb.rep{background:var(--part-bg);border-color:var(--part)} .fb.part .mk,.fb.rep .mk{background:var(--part)}
.fb.ko{background:var(--ko-bg);border-color:var(--ko)} .fb.ko .mk{background:var(--ko)}
.fb .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.fb .body b{font-size:1.05rem}
.corr{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.95rem}

/* Rédaction par blocs */
.blocks{display:flex;flex-direction:column;gap:10px}
.blk{border:1px solid var(--line);border-left:5px solid var(--lv0);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.blk .bh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.blk .bh .eyebrow{margin-right:auto}
.blk .line{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.blk .line .mathin{font-size:1.1rem;min-height:48px;flex:1 1 140px}
.blk .line select{flex:0 1 auto}
.blk.ok{border-left-color:var(--ok)} .blk.rep,.blk.part{border-left-color:var(--part)} .blk.ko{border-left-color:var(--ko)}
.blk .msg{font-size:.9rem;border-radius:8px;padding:6px 10px}
.blk.ok .msg{background:var(--ok-bg)} .blk.rep .msg,.blk.part .msg{background:var(--part-bg)} .blk.ko .msg{background:var(--ko-bg)}
.st{font-size:.78rem;font-weight:800;border-radius:99px;padding:2px 9px;color:#fff;white-space:nowrap}
.st.ok{background:var(--ok)} .st.rep,.st.part{background:var(--part)} .st.ko{background:var(--ko)}
.stepbox{display:flex;flex-direction:column;gap:10px}
.stepbox>h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fig{background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.fig svg{width:100%;max-width:300px;height:auto}
.fig text{font-family:var(--font-b);font-weight:700;fill:var(--ink)}
.total{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.total .big{font-family:var(--font-d);font-weight:800;font-size:2.2rem}
.model{background:var(--surface2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}

/* Brevet blanc */
.exam-card{border-top:6px solid var(--band)}
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.band{position:sticky;top:0;z-index:40;background:var(--band);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px)}
body.exam::before{background:var(--band)}
.band .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:60px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band .lbl{font-weight:800;letter-spacing:.12em;font-size:.8rem;text-transform:uppercase}
.band .lbl span{display:block;letter-spacing:0;text-transform:none;font-weight:400;font-size:.85rem;opacity:.85}
.timer{font-family:var(--font-b);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;margin-left:auto;padding:2px 12px;border-radius:10px;border:2px solid currentColor}
.timer.low{background:var(--ko);border-color:var(--ko);color:#fff}
.band .btn{min-height:44px;background:var(--band-ink);color:var(--band);border-color:var(--band-ink)}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.qnav button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.qnav button.ans{background:var(--surface2);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.qnav button[aria-current="true"]{border:2px solid var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.res-table{width:100%;border-collapse:collapse;font-size:.92rem}
.res-table th,.res-table td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl{overflow-x:auto}
.calc{display:flex;flex-direction:column;gap:8px}
.calc output{font-size:1.4rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.exnav{display:flex;gap:6px;flex-wrap:wrap}
.exnav button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:6px 12px;font-weight:700;cursor:pointer}
.exnav button[aria-current="true"]{border:2px solid var(--ink)}
.confirm{border:2px solid var(--ink);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}

/* Progrès */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{--c:var(--lv0);border-radius:12px;padding:10px 12px;border:1px solid var(--line);border-top:6px solid var(--c);background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-size:.9rem;overflow-wrap:anywhere}
.tile[data-l="1"]{--c:var(--lv1)} .tile[data-l="2"]{--c:var(--lv2)} .tile[data-l="3"]{--c:var(--lv3)} .tile[data-l="4"]{--c:var(--lv4)}
.tile.weak{background:var(--ko-bg)}
.score20{display:flex;align-items:baseline;gap:6px}
.score20 .big{font-family:var(--font-d);font-weight:800;font-size:3rem;line-height:1}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-b)}
.comp{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){ body:not(.exam) .pop{animation:pop .35s ease-out} @keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}} }

/* ---------- Compléments de la version 1 ---------- */
.narrow{max-width:760px}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
form.col{gap:10px}
body.noprofile nav.tabs,body.noprofile .tb-prof{display:none}
@media (min-width:900px){body.noprofile main{margin-left:0!important}}
.tb-prof{text-decoration:none;color:var(--ink);gap:6px;display:inline-flex;align-items:center;max-width:9rem}
.tb-prof span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:480px){.tb-prof span{display:none}#saved{display:none!important}}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;color:var(--ink)}

<script>
/* =====================================================================
   Cap Brevet – moteur mathématique
   Lecture des expressions saisies, calcul exact par valeur, correction
   déterministe (équivalences, forme demandée, unités, arrondis, erreurs
   fréquentes). Aucun appel réseau, aucune IA.
   ===================================================================== */
(function (G) {
  'use strict';

  /* ---------- Hasard reproductible (même graine = même question) ---------- */
  let _seed = 1;
  function setSeed(s) { _seed = (s >>> 0) || 1; }
  function rnd() { // mulberry32
    _seed = (_seed + 0x6D2B79F5) >>> 0;
    let t = _seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const R = (a, b) => a + Math.floor(rnd() * (b - a + 1));            // entier entre a et b
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const nz = (a, b) => { let v; do { v = R(a, b); } while (v === 0); return v; };
  const sgn = () => (rnd() < 0.5 ? -1 : 1);
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  /* ---------- Arithmétique ---------- */
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
  const isPrime = n => { if (n < 2 || !Number.isInteger(n)) return false; for (let k = 2; k * k <= n; k++) if (n % k === 0) return false; return true; };
  const roundTo = (x, d) => { const p = Math.pow(10, d); return Math.round((x + Number.EPSILON * Math.sign(x)) * p) / p; };

  /* ---------- Lecture des expressions ---------- */
  const SUP = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-' };
  function norm(s) {
    s = String(s).trim();
    s = s.replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, m => '^(' + [...m].map(c => SUP[c]).join('') + ')');
    return s.replace(/[−–—]/g, '-').replace(/[×·∙]/g, '*').replace(/÷|:/g, '/').replace(/,/g, '.')
      .replace(/π/g, 'p').replace(/pi/gi, 'p').replace(/√/g, 'r').replace(/X/g, 'x').replace(/Y/g, 'y')
      .replace(/\s+/g, '');
  }
  function tokenize(s) {
    const t = []; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/[0-9.]/.test(c)) {
        let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++;
        const str = s.slice(i, j);
        if ((str.match(/\./g) || []).length > 1 || str === '.') throw new Error('nombre');
        t.push({ k: 'n', v: parseFloat(str), s: str }); i = j;
      } else if ('xypr+-*/^()'.includes(c)) { t.push({ k: c }); i++; }
      else throw new Error('caractère');
    }

  }
  function parse(src) {
    const t = tokenize(norm(src)); let i = 0;
    if (!t.length) throw new Error('vide');
    const peek = () => t[i], eat = k => { if (t[i] && t[i].k === k) { i++; return true; } return false; };
    function expr() { let n = term(); while (peek() && (peek().k === '+' || peek().k === '-')) { const op = t[i++].k; n = { t: 'b', op, a: n, b: term() }; } return n; }
    function term() {
      let n = unary();
      for (;;) {
        const p = peek(); if (!p) break;
        if (p.k === '*' || p.k === '/') { i++; n = { t: 'b', op: p.k, a: n, b: unary() }; }
        else if ('nxypr('.includes(p.k)) { n = { t: 'b', op: '*', a: n, b: power(), imp: true }; }
        else break;
      }
      return n;
    }
    function unary() { if (eat('-')) return { t: 'neg', a: unary() }; if (eat('+')) return unary(); return power(); }
    function power() { const base = atom(); if (eat('^')) return { t: 'pow', a: base, b: unary() }; return base; }
    function atom() {
      const p = t[i++]; if (!p) throw new Error('fin');
      if (p.k === 'n') return { t: 'n', v: p.v, s: p.s };
      if (p.k === 'x' || p.k === 'y') return { t: 'v', name: p.k };
      if (p.k === 'p') return { t: 'pi' };
      if (p.k === 'r') return { t: 'sqrt', a: power() };
      if (p.k === '(') { const e = expr(); if (!eat(')')) throw new Error('parenthèse'); return { t: 'par', a: e }; }
      throw new Error('symbole');
    }
    const r = expr(); if (i < t.length) throw new Error('reste');
    return r;
  }
  function ev(n, env) {
    env = env || {};
    switch (n.t) {
      case 'n': return n.v; case 'pi': return Math.PI; case 'v': return env[n.name] ?? NaN; case 'par': return ev(n.a, env);

    }

  }
  function val(s) { try { return ev(parse(s)); } catch (e) { return NaN; } }
  const close = (a, b, tol = 1e-9) => Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) <= tol * Math.max(1, Math.abs(b));
  const has = (n, type) => !!n && (n.t === type || ['a', 'b'].some(k => n[k] && typeof n[k] === 'object' && has(n[k], type)));
  const isInt = n => n && n.t === 'n' && Number.isInteger(n.v);
  const isSInt = n => isInt(n) || (n && n.t === 'neg' && isInt(n.a));          // entier éventuellement précédé de −
  const sIntV = n => (n.t === 'neg' ? -n.a.v : n.v);

  /* Termes d'une somme (au premier niveau) */
  function terms(n, out) {
    out = out || [];

    else out.push(n);

  }
  function degree(term) {
    const a = ev(term, { x: 2 }), b = ev(term, { x: 3 });

    return Math.round(Math.log(Math.abs(b / a)) / Math.log(1.5));
  }

  /* ---------- Contrôle de la forme demandée ---------- */
  function formCheck(form, ast) {
    let n = ast; if (n.t === 'neg') n = n.a;
    if (form === 'irr') {
      if (isInt(n)) return { ok: true };
      if (n.t === 'b' && n.op === '/' && isSInt(n.a) && isSInt(n.b)) {
        const A = Math.abs(sIntV(n.a)), B = Math.abs(sIntV(n.b)), g = gcd(A, B);
        if (B === 1) return { ok: false, t: 'Juste, mais pas simplifié', m: 'Une fraction de dénominateur 1 s’écrit comme un nombre entier.' };
        if (g > 1) return { ok: false, t: 'Juste, mais pas simplifié', m: `${A} et ${B} sont tous les deux divisibles par ${g}. Simplifie la fraction.` };
        return { ok: true };
      }
      return { ok: false, t: 'Juste, mais pas sous la forme demandée', m: 'La consigne demande une fraction irréductible, par exemple 3/4.' };
    }
    if (form === 'frac') { // une fraction ou un entier, pas un décimal approché
      if (isInt(n) || (n.t === 'b' && n.op === '/' && isSInt(n.a) && isSInt(n.b))) return { ok: true };
      return { ok: false, t: 'Juste, mais pas sous la forme demandée', m: 'La consigne demande une fraction, par exemple 3/8.' };
    }
    if (form === 'dev' || form === 'red') {
      if (has(ast, 'par')) return { ok: false, t: form === 'dev' ? 'Pas encore développé' : 'Pas encore réduit', m: 'Il reste des parenthèses. Distribue sur chaque terme, puis regroupe les termes de même nature.' };
      const ds = terms(ast).map(degree); const seen = {};
      for (const d of ds) { if (seen[d]) return { ok: false, t: 'Juste, mais pas réduit', m: 'Regroupe les termes de même nature : les x² ensemble, les x ensemble, les nombres ensemble.' }; seen[d] = 1; }
      return { ok: true };
    }
    if (form === 'fac') {
      const prod = (n.t === 'b' && n.op === '*' && has(n, 'par')) || (n.t === 'pow' && n.a.t === 'par');
      if (!prod) return { ok: false, t: 'Pas encore factorisé', m: 'Une forme factorisée est un produit, par exemple 3(x + 2) ou (x − 3)(x + 3).' };
      return { ok: true };
    }
    if (form === 'pi') {
      if (!has(ast, 'pi')) return { ok: false, t: 'Valeur approchée', m: 'La consigne demande la valeur exacte, en fonction de π (par exemple 9π).' };
      return { ok: true };
    }
    if (form === 'sci') {
      const okSci = (n.t === 'b' && n.op === '*' && n.a.t === 'n' && n.a.v >= 1 && n.a.v < 10 && n.b.t === 'pow' && isInt(n.b.a) && n.b.a.v === 10);
      if (!okSci) return { ok: false, t: 'Juste, mais pas en notation scientifique', m: 'La notation scientifique s’écrit a × 10ⁿ avec 1 ≤ a < 10, par exemple 3,45 × 10^4.' };
      return { ok: true };
    }
    if (form === 'primes') {
      const facs = []; (function walk(m) { if (m.t === 'b' && m.op === '*') { walk(m.a); walk(m.b); } else facs.push(m); })(n);
      const okP = facs.every(f => (isInt(f) && isPrime(f.v)) || (f.t === 'pow' && isInt(f.a) && isPrime(f.a.v) && isInt(f.b)));
      if (!okP) return { ok: false, t: 'Juste, mais pas décomposé en facteurs premiers', m: 'Chaque facteur doit être un nombre premier (2, 3, 5, 7, 11…). Continue la décomposition.' };
      return { ok: true };
    }
    if (form === 'p10') {
      const okP = (n.t === 'pow' && isInt(n.a) && n.a.v === 10) || (isInt(n) && n.v === 10);
      if (!okP) return { ok: false, t: 'Juste, mais pas sous la forme demandée', m: 'La consigne demande une seule puissance de 10, par exemple 10^5 ou 10^-3.' };
      return { ok: true };
    }
    if (form === 'int') {
      if (!isInt(n)) return { ok: false, t: 'Juste, mais pas sous la forme demandée', m: 'Donne le résultat sous forme d’un nombre entier.' };
      return { ok: true };
    }
    return { ok: true };
  }

  /* ---------- Unités ---------- */
  const UNITS = {
    mm: ['L', 0.001], cm: ['L', 0.01], dm: ['L', 0.1], m: ['L', 1], km: ['L', 1000],
    'mm²': ['A', 1e-6], 'cm²': ['A', 1e-4], 'dm²': ['A', 0.01], 'm²': ['A', 1], 'km²': ['A', 1e6],
    'mm³': ['V', 1e-9], 'cm³': ['V', 1e-6], 'dm³': ['V', 1e-3], 'm³': ['V', 1], mL: ['V', 1e-6], cL: ['V', 1e-5], dL: ['V', 1e-4], L: ['V', 1e-3],
    mg: ['M', 0.001], g: ['M', 1], kg: ['M', 1000], s: ['T', 1], min: ['T', 60], h: ['T', 3600],
    'km/h': ['S', 1 / 3.6], 'm/s': ['S', 1], '€': ['E', 1], '%': ['P', 1], '°': ['D', 1]
  };
  const UNIT_RE = /\s*(km\/h|m\/s|mm²|cm²|dm²|km²|m²|mm³|cm³|dm³|m³|mm2|cm2|dm2|km2|m2|mm3|cm3|dm3|m3|mL|cL|dL|km|mm|cm|dm|kg|mg|min|m|L|g|h|s|€|%|°)\s*$/;
  function splitUnit(raw) {

  /* ---------- Correction d'une réponse ---------- */
  const SAMPLES = [-1.7, 0.3, 2.9, 5.1];
  function stripVar(r) { return r.replace(/^\s*([a-zA-Z]{1,2}|[a-zA-Z]\s*\(\s*[x0-9,.\-−]*\s*\))\s*=\s*/, ''); }

    if (q.type === 'qcm') {

      if (ok) return { s: 'ok', pts, t: 'Juste', m: q.okm || '' };
      const e = (q.errs || []).find(e => e.i === Number(raw));
      return { s: 'ko', pts: 0, t: 'Faux', m: e ? e.m : (q.hint || 'Relis bien l’énoncé et reprends la propriété du cours.') };
    }

    let [r, uTyped] = splitUnit(raw);

    const unit = unitSel || uTyped || '';
    if (q.strip !== false) r = stripVar(r);

      const parts = r.split(/;|\bou\b|\bet\b/).map(s => stripVar(s.trim())).filter(Boolean);
      const vals = parts.map(val);
      if (vals.some(v => !Number.isFinite(v))) return { s: 'ko', pts: 0, t: 'Écriture non reconnue', m: 'Sépare les solutions par « ou », par exemple : x = 2 ou x = −3.' };
      const want = q.set.slice(); let found = 0; const extra = [];
      for (const v of vals) { const k = want.findIndex(w => close(v, w)); if (k >= 0) { want.splice(k, 1); found++; } else extra.push(v); }
      if (!want.length && !extra.length) return { s: 'ok', pts, t: 'Juste', m: q.okm || '' };
      if (found && !extra.length) return { s: 'part', pts: pts / 2, t: 'Incomplet', m: 'Il manque au moins une solution. Un produit est nul si l’un de ses facteurs est nul : il y a un cas par facteur.' };
      for (const e of q.errs || []) if (e.set && e.set.length === vals.length && e.set.every(w => vals.some(v => close(v, w)))) return { s: 'ko', pts: 0, t: 'Faux', m: e.m };
      return { s: 'ko', pts: 0, t: 'Faux', m: q.hint || 'Résous chaque cas séparément et vérifie en remplaçant x.' };
    }

    let ast;
    try { ast = parse(r); } catch (e) {
      return { s: 'ko', pts: 0, t: 'Écriture non reconnue', m: 'Vérifie les parenthèses et les signes. Exemples d’écriture : 3/4 ; 2x + 1 ; 9π ; 3,5.' };
    }
    if (!q.f && has(ast, 'v')) return { s: 'ko', pts: 0, t: 'Faux', m: 'La réponse attendue est un nombre, sans lettre.' };

    let v = q.f ? NaN : ev(ast, {});
    // Conversion d'une unité équivalente (2,5 m = 250 cm)
    let unitNote = '';
    if (q.unit && unit && unit !== q.unit && UNITS[unit] && UNITS[q.unit] && UNITS[unit][0] === UNITS[q.unit][0]) {

    }
    let eq;
    if (q.f) eq = equalVal(ast, q);
    else if (q.round != null) {
      const target = roundTo(q.v, q.round);
      eq = close(v, target, 1e-9) || close(v, q.v, 1e-9);
      if (!eq && Math.abs(v - q.v) < Math.pow(10, -q.round)) {
        return { s: 'part', pts: pts / 2, t: 'Arrondi incorrect', m: `Le résultat est presque juste, mais la consigne demande un arrondi ${['à l’unité', 'au dixième', 'au centième', 'au millième'][q.round]}. Regarde le chiffre suivant pour arrondir.` };
      }
    } else eq = close(v, q.v, q.tol || 1e-9);

    if (eq) {
      if (q.form) { const fc = formCheck(q.form, ast); if (!fc.ok) return { s: 'part', pts: pts / 2, t: fc.t, m: fc.m }; }

    const [tx, ty, tz] = pick([[3, 4, 5], [6, 8, 10], [5, 12, 13], [9, 12, 15], [8, 15, 17], [12, 16, 20]]), sc = pick([1, 1, 2]);
    const AB = tx * sc, BC = ty * sc, good = R(0, 1) === 1, ACs = good ? tz * sc : tz * sc + pick([1, -1]);
    const [rn, rd] = pick([[1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [2, 5], [3, 5]]), AM = roundTo(AB * rn / rd, 6), MN = roundTo(BC * rn / rd, 6);
    return { id: 'geo-th', title: 'Géométrie : Thalès et triangle rectangle', pts: 3.5, dom: 'eg',
      intro: `Sur la figure, M est un point du segment [AB] et N un point du segment [AC]. Les droites (MN) et (BC) sont parallèles.<br>On donne AM = ${n(AM)} cm, AB = ${n(AB)} cm, BC = ${n(BC)} cm et AC = ${n(ACs)} cm.${B.fig.thalesFig(['A', 'B', 'C', 'M', 'N'])}`,
      parts: [
        { id: 'p1', q: '1. Calculer la longueur MN.', pts: { prop: .5, pose: .5, res: 1 },
          prop: { choices: PROP_GEO, ok: [2] }, pose: { lead: 'MN =', exp: () => BC * AM / AB, ans: `${a(BC)}*${a(AM)}/${a(AB)}` },
          res: { lead: 'MN =', exp: () => MN, unit: 'cm', units: ['cm', 'cm²', 'm'], ans: a(MN) },
          corr: `Les droites (BM) et (CN) sont sécantes en A et (MN) // (BC). D’après le théorème de Thalès : AM/AB = AN/AC = MN/BC, donc MN = ${n(BC)} × ${n(AM)} ÷ ${n(AB)} = ${n(MN)} cm.` },
        { id: 'p2', q: '2. Le triangle ABC est-il rectangle en B ? Justifier.', pts: { prop: .5, pose: .5, res: .5 },
          prop: { choices: PROP_GEO, ok: [1] }, pose: { lead: 'AB² + BC² =', exp: () => AB * AB + BC * BC, ans: `${a(AB)}^2+${a(BC)}^2` },
          res: { lead: 'Conclusion :', type: 'qcm', choices: ['Oui, ABC est rectangle en B', 'Non, ABC n’est pas rectangle en B'], correct: () => (good ? 0 : 1), ans: good ? '0' : '1' },
          corr: `[AC] est le plus grand côté. AC² = ${n(roundTo(ACs * ACs, 4))} et AB² + BC² = ${n(AB * AB)} + ${n(BC * BC)} = ${n(roundTo(AB * AB + BC * BC, 4))}. ${good ? 'Les deux résultats sont égaux : d’après la réciproque du théorème de Pythagore, ABC est rectangle en B.' : 'Les résultats sont différents : d’après la contraposée du théorème de Pythagore, ABC n’est pas rectangle.'}` }
      ] };
  }

  /* ---------------- Pourcentages ---------------- */
  function pctSoldes() {

      intro: `Pendant les soldes, ${it} affiché à <b>${P} €</b> bénéficie d’une première réduction de <b>${t1} %</b>. Le dernier jour, le magasin applique une réduction supplémentaire de <b>${t2} %</b> sur le prix déjà soldé.`,
      parts: [
        { id: 'p1', q: '1. Quel est le prix après la première réduction ?', pts: { pose: .25, res: .75 }, pose: { lead: 'Calcul :', exp: () => p1, ans: `${P}*${a(1 - t1 / 100)}` },
          res: { lead: 'Prix :', exp: () => p1, suffix: '€', ans: a(p1) }, corr: `${P} × (1 − ${t1}/100) = ${P} × ${n(1 - t1 / 100)} = ${n(p1)} €.` },
        { id: 'p2', q: '2. Quel est le prix payé le dernier jour ?', pts: { res: .75 }, res: { lead: 'Prix :', exp: V => V.p1 * (1 - t2 / 100), suffix: '€', ans: a(p2) },
          corr: `${n(p1)} × ${n(1 - t2 / 100)} = ${n(p2)} €.` },
        { id: 'p3', q: `3. Un client affirme : « Au total, la réduction est de ${t1 + t2} % ». A-t-il raison ? Calculer le pourcentage réel de réduction par rapport au prix affiché.`, pts: { res: .75 },
          res: { lead: 'Réduction réelle :', exp: V => (1 - V.p2 / P) * 100, suffix: '%', ans: a(roundTo(g, 6)) },
          corr: `Le client se trompe. Coefficient global : ${n(1 - t1 / 100)} × ${n(1 - t2 / 100)} = ${n(roundTo(p2 / P, 6))}, soit une réduction de ${n(roundTo(g, 4))} %, et non ${t1 + t2} %.` }
      ] };
  }
  function pctAbo() {

    const k = R(3, 8), s = Math.floor(c / (w - u)) + 1, lieu = pick(['Un cinéma', 'Une piscine', 'Une patinoire', 'Un bowling']);
    return { id: 'pct-a', title: 'Choisir le bon tarif', pts: 2.5, dom: 'nc',
      intro: `${lieu} propose deux tarifs.<br>Tarif plein : <b>${w} €</b> par entrée.<br>Tarif carte : une carte annuelle à <b>${c} €</b>, puis <b>${u} €</b> par entrée.`,
      parts: [
        { id: 'p1', q: `1. Combien paie-t-on pour ${k} entrées avec le tarif carte ?`, pts: { pose: .25, res: .5 }, pose: { lead: 'Calcul :', exp: () => c + u * k, ans: `${c}+${u}*${k}` }, res: { lead: 'Prix :', exp: () => c + u * k, suffix: '€', ans: String(c + u * k) }, corr: `${c} + ${u} × ${k} = ${c + u * k} €.` },
        { id: 'p2', q: `2. Combien paie-t-on pour ${k} entrées avec le tarif plein ?`, pts: { res: .5 }, res: { lead: 'Prix :', exp: () => w * k, suffix: '€', ans: String(w * k) }, corr: `${w} × ${k} = ${w * k} €.` },
        { id: 'p3', q: '3. À partir de combien d’entrées le tarif carte devient-il strictement moins cher que le tarif plein ?', pts: { res: 1.25 }, res: { lead: 'À partir de', exp: () => s, suffix: 'entrées', ans: String(s) },
          corr: `On cherche x tel que ${c} + ${u}x < ${w}x, soit ${c} < ${w - u}x, donc x > ${n(roundTo(c / (w - u), 2))}. Le tarif carte est moins cher à partir de ${s} entrées.` }

  /* ---------------- Statistiques ---------------- */
  function statSerie() {
    const cnt = pick([9, 10, 11]), ctx = pick([['températures maximales relevées pendant ' + cnt + ' jours, en °C', 2, 24], ['temps, en minutes, mis par ' + cnt + ' élèves pour venir au collège', 5, 45], ['tailles, en cm, de ' + cnt + ' joueurs d’une équipe', 158, 192]]);
    const vals = Array.from({ length: cnt }, () => R(ctx[1], ctx[2])), s = vals.slice().sort((x, y) => x - y);
    const mean = vals.reduce((t, x) => t + x, 0) / cnt, med = cnt % 2 ? s[(cnt - 1) / 2] : (s[cnt / 2 - 1] + s[cnt / 2]) / 2, et = s[cnt - 1] - s[0];
    return { id: 'stat-s', title: 'Statistiques', pts: 2, dom: 'df',
      intro: `Voici les ${ctx[0]} :<br>${M_(vals.join(' ; '))}`,
      parts: [
        { id: 'p1', q: '1. Calculer la moyenne de cette série, arrondie au dixième.', pts: { res: .75 }, res: { lead: 'Moyenne ≈', exp: () => mean, round: 1, ans: a(roundTo(mean, 1)) }, corr: `Somme : ${vals.reduce((t, x) => t + x, 0)}. Moyenne : ${vals.reduce((t, x) => t + x, 0)} ÷ ${cnt} ≈ ${n(roundTo(mean, 1))}.` },
        { id: 'p2', q: '2. Déterminer la médiane de cette série.', pts: { res: .75 }, res: { lead: 'Médiane =', exp: () => med, ans: a(med) }, corr: `Série rangée : ${s.join(' ; ')}. ${cnt % 2 ? `La médiane est la ${(cnt + 1) / 2}e valeur : ${med}.` : `La médiane est la moyenne des ${cnt / 2}e et ${cnt / 2 + 1}e valeurs : ${n(med)}.`}` },
        { id: 'p3', q: '3. Calculer l’étendue de cette série.', pts: { res: .5 }, res: { lead: 'Étendue =', exp: () => et, ans: String(et) }, corr: `${s[cnt - 1]} − ${s[0]} = ${et}.` }
      ] };
  }
  function statTable() {
    const xs = [0, 1, 2, 3, 4], ef = xs.map(() => R(1, 9)), N = ef.reduce((t, x) => t + x, 0), S = xs.reduce((t, x, i) => t + x * ef[i], 0), k = pick([2, 3]);
    const atl = ef.slice(k).reduce((t, x) => t + x, 0);
    return { id: 'stat-t', title: 'Statistiques : enquête', pts: 2, dom: 'df',
      intro: `On a demandé aux élèves d’une classe combien de frères et sœurs ils ont. Voici les résultats :${B.htable('Nombre de frères et sœurs', xs, 'Effectif', ef)}`,
      parts: [
        { id: 'p1', q: '1. Combien d’élèves ont répondu ?', pts: { res: .5 }, res: { lead: 'Effectif total :', exp: () => N, suffix: 'élèves', ans: String(N) }, corr: `${ef.join(' + ')} = ${N} élèves.` },
        { id: 'p2', q: '2. Calculer le nombre moyen de frères et sœurs, arrondi au dixième.', pts: { res: .75 }, res: { lead: 'Moyenne ≈', exp: V => S / V.p1, round: 1, ans: a(roundTo(S / N, 1)) }, corr: `(${xs.map((x, i) => `${x} × ${ef[i]}`).join(' + ')}) ÷ ${N} = ${S} ÷ ${N} ≈ ${n(roundTo(S / N, 1))}.` },
        { id: 'p3', q: `3. Quel pourcentage des élèves ont au moins ${k} frères et sœurs ? Arrondir à l’unité.`, pts: { res: .75 }, res: { lead: 'Pourcentage ≈', exp: V => atl / V.p1 * 100, round: 0, suffix: '%', ans: a(roundTo(atl / N * 100, 0)) }, corr: `${ef.slice(k).join(' + ')} = ${atl} élèves sur ${N}, soit ${atl} ÷ ${N} × 100 ≈ ${roundTo(atl / N * 100, 0)} %.` }
      ] };
  }

  /* ---------------- Fonctions ---------------- */
  function foncTarifs() {
    let aa, b, c, sol; do { aa = R(6, 15); b = R(2, aa - 2); sol = R(4, 15); c = (aa - b) * sol; } while (c > 120);
    const k = R(2, sol - 1), m = sol + R(2, 6), cheaperB = m > sol;
    return { id: 'fonc-t', title: 'Fonctions : deux tarifs', pts: 3, dom: 'df',
      intro: `Un club de sport propose deux formules. On note x le nombre de séances.<br>Formule A : ${aa} € la séance. Son prix est donné par ${M_(`f(x) = ${aa}x`)}.<br>Formule B : un abonnement de ${c} € puis ${b} € la séance. Son prix est donné par ${M_(`g(x) = ${b}x + ${c}`)}.`,
      parts: [
        { id: 'p1', q: `1. Calculer f(${k}).`, pts: { res: .5 }, res: { lead: `f(${k}) =`, exp: () => aa * k, ans: String(aa * k) }, corr: `f(${k}) = ${aa} × ${k} = ${aa * k}.` },
        { id: 'p2', q: `2. Calculer g(${k}).`, pts: { res: .5 }, res: { lead: `g(${k}) =`, exp: () => b * k + c, ans: String(b * k + c) }, corr: `g(${k}) = ${b} × ${k} + ${c} = ${b * k + c}.` },
        { id: 'p3', q: '3. Résoudre l’équation f(x) = g(x). Que représente la solution ?', pts: { pose: .25, res: .75 }, pose: { lead: 'Équation réduite : x =', exp: () => sol, ans: `${c}/${aa - b}` },
          res: { lead: 'x =', exp: () => sol, ans: String(sol) }, corr: `${aa}x = ${b}x + ${c} ⇔ ${aa - b}x = ${c} ⇔ x = ${sol}. Pour ${sol} séances, les deux formules coûtent le même prix.` },
        { id: 'p4', q: `4. Une personne prévoit ${m} séances. Quelle formule est la plus avantageuse ?`, pts: { res: 1 }, res: { lead: 'Réponse :', type: 'qcm', choices: ['Formule A', 'Formule B', 'Les deux coûtent le même prix'], correct: () => (cheaperB ? 1 : 0), ans: cheaperB ? '1' : '0' },
          corr: `f(${m}) = ${aa * m} € et g(${m}) = ${b * m + c} €. La formule ${cheaperB ? 'B' : 'A'} est la plus avantageuse.` }
      ] };
  }
  function foncProgramme() {
    let k, aa, mm, c, sol; do { k = R(2, 5); aa = R(1, 6); mm = R(1, 6); sol = R(-5, 9); c = (k - mm) * sol + k * aa; } while (k === mm || c === 0);
    const x0 = R(2, 6), progA = `<ol class="prog"><li>Choisir un nombre.</li><li>Lui ajouter ${aa}.</li><li>Multiplier le résultat par ${k}.</li></ol>`, progB = `<ol class="prog"><li>Choisir un nombre.</li><li>Le multiplier par ${mm}.</li><li>Ajouter ${n(c)} au résultat.</li></ol>`;
    return { id: 'fonc-p', title: 'Programmes de calcul', pts: 3, dom: 'nc',
      intro: `<div class="grid2"><div><b>Programme A</b>${progA}</div><div><b>Programme B</b>${progB}</div></div>`,
      parts: [
        { id: 'p1', q: `1. Quel résultat donne le programme A avec le nombre ${x0} ?`, pts: { res: .5 }, res: { lead: 'Résultat :', exp: () => (x0 + aa) * k, ans: String((x0 + aa) * k) }, corr: `(${x0} + ${aa}) × ${k} = ${(x0 + aa) * k}.` },
        { id: 'p2', q: `2. Quel résultat donne le programme B avec le nombre ${x0} ?`, pts: { res: .5 }, res: { lead: 'Résultat :', exp: () => mm * x0 + c, ans: a(mm * x0 + c) }, corr: `${x0} × ${mm} + ${p(c)} = ${n(mm * x0 + c)}.` },
        { id: 'p3', q: '3. On choisit le nombre x. Exprimer le résultat du programme A en fonction de x, sous forme développée.', pts: { res: 1 }, res: { lead: 'Résultat =', f: x => k * (x + aa), form: 'dev', ans: `${k}x+${k * aa}` }, corr: `(x + ${aa}) × ${k} = ${k}x + ${k * aa}.` },
        { id: 'p4', q: '4. Quel nombre faut-il choisir pour que les deux programmes donnent le même résultat ?', pts: { res: 1 }, res: { lead: 'Nombre :', exp: () => sol, ans: String(sol) }, corr: `${k}x + ${k * aa} = ${mm}x + ${n(c)} ⇔ ${k - mm}x = ${n(c - k * aa)} ⇔ x = ${n(sol)}.` }
      ] };
  }

  /* ---------------- Probabilités ---------------- */
  function probaUrne() {
    let r, b, v; do { r = R(2, 8); b = R(2, 8); v = R(1, 6); } while (b + v - r < 1);
    const T = r + b + v, add = b + v - r;
    return { id: 'proba-u', title: 'Probabilités', pts: 1.5, dom: 'df',
      intro: `Un sac contient ${r} jetons rouges, ${b} jetons bleus et ${v} jeton${v > 1 ? 's' : ''} vert${v > 1 ? 's' : ''}, indiscernables au toucher. On tire un jeton au hasard.`,
      parts: [
        { id: 'p1', q: '1. Quelle est la probabilité de tirer un jeton rouge ?', pts: { res: .5 }, res: { lead: 'P =', exp: () => r / T, ans: `${r}/${T}` }, corr: `${r} jetons rouges sur ${T} : P = ${F(r, T)}.` },
        { id: 'p2', q: '2. Quelle est la probabilité de ne pas tirer un jeton vert ?', pts: { res: .5 }, res: { lead: 'P =', exp: () => 1 - v / T, ans: `${T - v}/${T}` }, corr: `1 − ${F(v, T)} = ${F(T - v, T)}.` },
        { id: 'p3', q: '3. Combien de jetons rouges faut-il ajouter pour que la probabilité de tirer un rouge soit égale à 1/2 ?', pts: { res: .5 }, res: { lead: 'Il faut ajouter', exp: () => add, suffix: 'jetons', ans: String(add) }, corr: `Il faut autant de rouges que de non-rouges : ${b} + ${v} = ${b + v}. On ajoute ${b + v} − ${r} = ${add} jetons rouges.` }
      ] };
  }
  function probaRoue() {
    const N = pick([8, 10, 12]), m = pick([3, 4, 5]), nm = Math.floor(N / m), pr = Array.from({ length: N }, (_, i) => i + 1).filter(G.M.isPrime).length;

  /* ---------- Examen blanc d'automatismes ---------- */
  const QUOTA = { nc: 6, df: 3, gm: 3, eg: 2, ap: 1 };
  function buildExam() {
    const p = P(), lastGens = new Set((p.exams.filter(e => e.type === 'auto').slice(-1)[0]?.items || []).map(it => it.ref.g));
    const refs = [];
    for (const [d, k] of Object.entries(QUOTA)) {
      let pool = []; BANK.NOTIONS.filter(x => x.dom === d).forEach(no => no.gens.filter(g => g.auto && !g.calc && g.lv.some(l => l <= 3)).forEach(g => pool.push({ no, g })));
      pool = M.shuffle ? pool.sort(() => Math.random() - 0.5) : pool;
      pool.sort((x, y) => (lastGens.has(x.g.id) ? 1 : 0) - (lastGens.has(y.g.id) ? 1 : 0));
      const usedN = {};
      for (const it of pool) {
        if (refs.filter(r => BANK.byId[r.n].dom === d).length >= k) break;
        if ((usedN[it.no.id] || 0) >= 2) continue; usedN[it.no.id] = (usedN[it.no.id] || 0) + 1;
        const L = it.g.lv.includes(2) ? 2 : it.g.lv.filter(l => l <= 3).pop();
        let q, tries = 0; do { q = BANK.make({ n: it.no.id, g: it.g.id, L, s: Math.floor(Math.random() * 2 ** 31) }); tries++; } while (q.calc && tries < 5);
        refs.push(q.ref);
      }
    }
    return refs.sort(() => Math.random() - 0.5);
  }

    save();
  }
  let examQs = null, examKey = '';
  function examQuestions() { const c = P().cur; const k = c.start + ':' + c.refs.length; if (examKey !== k) { examQs = c.refs.map(BANK.make); examKey = k; } return examQs; }
  function submitExam(timeout) {
    const p = P(), c = p.cur; if (!c) return; const qs = examQuestions();
    const items = qs.map((q, i) => { const r = M.grade({ ...q, pts: 0.4 }, c.ans[i] || '', c.units[i] || ''); return { ref: q.ref, ans: c.ans[i] || '', unit: c.units[i] || '', s: r.s, pts: r.pts }; });

  function scrExamPb() {

      case 'redNew': newRed(); if (route() === 'redaction') render(); break;
      case 'redGrade': S.red.g = gradeRed(S.red); render(true); break;
      case 'model': S.showModel = !S.showModel; render(true); break;
      case 'startExam': startExam(); location.hash = 'examen'; break;
      case 'startExamPb': startExamPb(null); location.hash = 'examen-pb'; break;
      case 'startFull': startExam(true); location.hash = 'examen'; break;
      case 'goex': p.cur.ex = Math.max(0, Math.min(5, +b.dataset.i)); save(); render(); break;
      case 'pbChoose': { const c = p.cur, A = (c.ans[b.dataset.ex] ||= {}); (A[b.dataset.part] ||= {}).res = b.dataset.i; save(); render(true); break; }
      case 'pbAddStep': { const c = p.cur, A = (c.ans[c.ex] ||= {}); (A.steps ||= []).push({ k: '', pose: '', val: '', unit: '' }); save(); render(true); break; }
      case 'pbDelStep': { const c = p.cur, A = (c.ans[c.ex] ||= {}); A.steps.splice(+b.dataset.i, 1); save(); render(true); break; }
      case 'goq': p.cur.i = +b.dataset.i; save(); render(true); break;
      case 'prevq': p.cur.i--; save(); render(true); break;
      case 'nextq': p.cur.i++; save(); render(true); break;
      case 'askSubmit': p.cur.confirm = true; render(); break;
      case 'cancelSubmit': p.cur.confirm = false; render(true); break;
      case 'submit': if (p.cur.type === 'pb') submitExamPb(false); else submitExam(false); break;
      case 'copy': S.copy = +b.dataset.i; break;
      case 'export': { const code = exportCode(); S.expMsg = 'Code copié. Colle-le dans un message ou un fichier pour le garder.'; try { navigator.clipboard.writeText(code).catch(() => { S.expMsg = 'Sélectionne le code ci-dessous et copie-le.'; render(true); }); } catch (_) { S.expMsg = 'Sélectionne le code ci-dessous et copie-le.'; } render(true); break; }
      case 'import': { try { const o = JSON.parse(decodeURIComponent(escape(atob(S.imp.trim())))); if (o.app !== 'capbrevet' || !o.profile) throw 0; const id = 'p' + Date.now().toString(36); o.profile.cur = null; DB.profiles[id] = o.profile; DB.cur = id; save(); S.imp = ''; S.impMsg = `Sauvegarde de « ${esc(o.profile.pseudo)} » restaurée.`; } catch (err) { S.impMsg = 'Ce code n’est pas valide. Vérifie que tu l’as copié en entier.'; } render(true); break; }
      case 'tiers': p.settings.tiers = b.checked; save(); break;
      case 'delAsk': S.del = true; render(true); break;
      case 'delNo': S.del = false; render(true); break;
      case 'delYes': delete DB.profiles[DB.cur]; DB.cur = null; S.del = false; save(); location.hash = 'accueil'; render(); break;
    }
  });

  /* Chronomètres : examen (heure de fin fixée au départ) et séries Averti(e)/Expert(e) */
  function tick() {
    if (!DB.cur || !P()) return; const c = P().cur, r = route();
    if (c) {
      const left = c.end - Date.now();
      const er = c.type === 'pb' ? 'examen-pb' : 'examen';
      if (left <= 0) { if (r === er) { if (c.type === 'pb') submitExamPb(true); else submitExam(true); } return; }
      let w = ''; if (left <= 60000) w = 'Il reste moins d’1 minute. Tes réponses sont enregistrées.'; else if (left <= 300000) w = 'Il reste moins de 5 minutes.';
      if (w !== c.warn) { c.warn = w; if (r === er) { render(true); return; } }
      const t = document.getElementById('timer'); if (t && r === er) { t.textContent = clock(left); t.classList.toggle('low', left < 300000); }
    }
    const ch = document.getElementById('chrono'); if (ch && S.series && !S.series.fb) ch.textContent = clock(Date.now() - S.series.qStart);
  }
  setInterval(tick, 1000);

  load();
  try { const th = localStorage.getItem('capbrevet.theme'); if (th) document.documentElement.dataset.theme = th; const sc = localStorage.getItem('capbrevet.scale'); if (sc) document.documentElement.style.setProperty('--scale', sc); } catch (_) { }
  render();
})();

</script>
